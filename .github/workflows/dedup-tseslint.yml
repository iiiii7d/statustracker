name: Dedupe typescript-eslint
on:
  push:
    branches: ["renovate/*-eslint-group"]

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedup-typescript-eslint:
    name: Dedupe typescript-eslint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: $/.github/actions/mise

      - run: pnpm up -r '@typescript-eslint/*'

      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          default_author: github_actions
          message: Deduplicate `@typescript/eslint`
