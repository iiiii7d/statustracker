services:
  postgres:
    image: docker.io/library/postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: statustracker
      POSTGRES_USER: statustracker
      POSTGRES_PASSWORD: password
    volumes:
      - "pgdata:/var/lib/postgresql"
    ports:
      - "5432:5432"

volumes:
  pgdata:
