services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_DB: statustracker
      POSTGRES_USER: statustracker
      POSTGRES_PASSWORD: password
    volumes:
      - "pgdata:/var/lib/postgresql"
    ports:
      - "5432:5432"

volumes:
  pgdata:
