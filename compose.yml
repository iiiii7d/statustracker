services:
  postgres:
    image: docker.io/library/postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: statustracker
      POSTGRES_USER: statustracker
      POSTGRES_PASSWORD: password
    volumes:
      - "pgdata:/var/lib/postgresql"
    ports:
      - "5432:5432"

volumes:
  pgdata:
