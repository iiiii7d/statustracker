services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: statustracker
      POSTGRES_USER: statustracker
      POSTGRES_PASSWORD: password
    volumes:
      - "pgdata:/var/lib/postgresql"
    ports:
      - "5432:5432"

volumes:
  pgdata:
